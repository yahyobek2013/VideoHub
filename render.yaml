services:
  - type: web
    name: videohub
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && python manage.py ensure_videohub_admin && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /login/
    disk:
      name: videohub-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SQLITE_PATH
        value: /var/data/db.sqlite3
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/media
      - key: VH_ADMIN_PHONE
        value: "930804866"
      - key: VH_ADMIN_LOGIN
        value: ybek
      - key: VH_ADMIN_PASSWORD
        sync: false
      - key: VH_ADMIN_NAME
        value: Yahyobek Yaqubboyev