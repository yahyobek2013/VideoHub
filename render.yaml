services:
  - type: web
    name: videohub
    runtime: python
    plan: starter
    rootDir: .
    buildCommand: python -m pip install -r requirements.txt && python manage.py collectstatic --noinput --clear --verbosity 2 && test -s staticfiles/css/style.css && test -s staticfiles/js/script.js
    startCommand: python manage.py migrate --noinput && python manage.py ensure_videohub_admin && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /login/
    disk:
      name: videohub-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: RENDER
        value: "true"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SQLITE_PATH
        value: /var/data/db.sqlite3
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/media
      - key: VH_ADMIN_PHONE
        value: "930804866"
      - key: VH_ADMIN_LOGIN
        value: ybek
      - key: VH_ADMIN_PASSWORD
        sync: false
      - key: VH_ADMIN_NAME
        value: Yahyobek Yaqubboyev